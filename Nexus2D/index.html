<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nexus2D - Stage 1</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			background: #0a0a0a;
			color: #e0e0e0;
			font-family: monospace;
		}

		#game-canvas {
			display: block;
			margin: 0 auto;
			background: #1a1a2e;
			border: 1px solid #333;
		}

		#hud {
			position: absolute;
			top: 8px;
			left: 8px;
			font-size: 12px;
			color: #8f8;
			pointer-events: none;
			text-shadow: 1px 1px 0 #000;
		}
	</style>
</head>
<body>
	<div id="hud">Nexus2D - Stage 1</div>
	<canvas id="game-canvas"></canvas>
	<script type="module" src="./src/main.js"></script>
</body>
</html>
